<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070A" />
    <title>Lanternfall</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307070A'/%3E%3Crect x='10' y='8' width='12' height='16' rx='5' fill='%23F5B83D'/%3E%3Crect x='13' y='4' width='6' height='3' fill='%23F2F0EA'/%3E%3Crect x='13' y='25' width='6' height='3' fill='%23F2F0EA'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="xp-bar"><div id="xp-fill"></div></div>
      <div id="hud-row">
        <span id="hud-level">Lv 1</span>
        <span id="hud-time">0:00</span>
        <div id="hp-bar" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="100">
          <div id="hp-fill"></div>
        </div>
      </div>
    </div>
    <button id="pause-btn" type="button" aria-label="Pause">II</button>
    <div id="stick-base" hidden><div id="stick-knob"></div></div>
    <div id="levelup" class="modal" hidden>
      <p class="levelup-title">Level 2</p>
      <div id="levelup-cards"></div>
      <p class="hint">Tap a card, then tap again to take it · keys 1–3</p>
    </div>
    <div id="pause" class="modal" hidden>
      <p class="modal-title">Paused</p>
      <p class="hint">Esc / P or tap to resume</p>
    </div>
    <div id="gameover" class="modal" hidden>
      <p class="modal-title" id="gameover-title"></p>
      <p id="gameover-stats"></p>
      <p class="hint">Press R or tap to try again</p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
